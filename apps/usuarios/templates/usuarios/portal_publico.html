{% extends "base.html" %}
{% load static %}
{% block title %}Inicio · Centro de reparaciones{% endblock %}
{% block extra_css %}
<style>
    body {
        background: linear-gradient(135deg, #F8F8F8 40%, #DDD);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
    }
    
    main {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    .welcome-card {
        background: white;
        border-radius: 20px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        padding: 3rem;
        max-width: 500px;
        width: 100%;
        position: relative;
        z-index: 10;
    }
</style>
{% endblock %}
{% block content %}
<div class="welcome-card">
    <h1 style="font-size: 2.5rem; font-weight: 300; margin-bottom: 1rem; color: #1f1f1f;">Centro de reparaciones</h1>
    <p style="font-size: 1.1rem; color: #666; margin-bottom: 2rem; line-height: 1.6;">
        Bienvenido. El área operativa es solo para personal autorizado.
    </p>
    <a href="{% url 'login_tecnico' %}" class="btn btn-cr-primary btn-lg" style="width: 100%; display: inline-block; padding: 12px; font-weight: 600; border-radius: 8px; text-align: center;">
        Acceso personal técnico
    </a>
</div>
{% endblock %}
