{% extends "base.html" %}
{% block title %}Confirmar borrar técnico{% endblock %}
{% block content %}
<main class="container mt-5">
    <div class="card p-4">
        <h2>Confirmar eliminación</h2>
        <p>Eliminar técnico <strong>{{ tecnico.usuario.username }}</strong> ({{ tecnico.usuario.correo }})?</p>
        <form method="post">
            {% csrf_token %}
            <button class="btn btn-danger">Eliminar</button>
            <a href="{% url 'admin_tecnicos' %}" class="btn btn-secondary ms-2">Cancelar</a>
        </form>
    </div>
</main>
{% endblock %}
