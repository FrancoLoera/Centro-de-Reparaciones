{% extends "base.html" %}
{% block title %}Estatuses{% endblock %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card card-cr">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span>Estatuses</span>
          <a href="{% url 'seguimiento:estatus_create' %}" class="btn btn-sm btn-cr-primary">Nuevo estatus</a>
        </div>
        <div class="card-body">
          <table class="table">
            <thead>
              <tr>
                <th>Nombre</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              {% for e in estatuses %}
                <tr>
                  <td>{{ e.nombre }}</td>
                  <td class="text-end">
                    <a href="{% url 'seguimiento:estatus_edit' e.pk %}" class="btn btn-sm btn-outline-secondary">Editar</a>
                    <a href="{% url 'seguimiento:estatus_delete' e.pk %}" class="btn btn-sm btn-outline-danger">Borrar</a>
                  </td>
                </tr>
              {% empty %}
                <tr><td colspan="2">No hay estatus definidos.</td></tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
