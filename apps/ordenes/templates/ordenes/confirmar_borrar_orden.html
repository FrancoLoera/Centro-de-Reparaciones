{% extends "base.html" %}
{% block title %}Confirmar borrado{% endblock %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card card-cr">
        <div class="card-header">Borrar orden</div>
        <div class="card-body">
          <p>¿Eliminar la orden <strong>{{ orden.codigo_seguimiento }}</strong> (idOrden {{ orden.id_orden }})?</p>
          <form method="post">
            {% csrf_token %}
            <button class="btn btn-danger">Borrar</button>
            <a href="{% url 'ordenes_lista' %}" class="btn btn-outline-secondary">Cancelar</a>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
