<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Marcas</title>
  </head>
  <body>
    <h1>Marcas de dispositivos</h1>

    <p>
      <a href="{% url 'marcas_crear' %}">Agregar nueva marca</a> |
      <a href="{% url 'dispositivos_lista' %}">Ver dispositivos</a>
    </p>

    {% if marcas %}
      <table border="1" cellpadding="4" cellspacing="0">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          {% for m in marcas %}
            <tr>
              <td>{{ m.id_marca }}</td>
              <td>{{ m.nombre }}</td>
              <td>
                <a href="{% url 'marcas_editar' m.id_marca %}">Editar</a>
                |
                <a href="{% url 'marcas_borrar' m.id_marca %}">Borrar</a>
              </td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    {% else %}
      <p>No hay marcas registradas.</p>
    {% endif %}
  </body>
  </html>
